        - generic "What is the best GPU for deep learning?":
          - generic [ref=e620]:
            - paragraph [ref=e621]: It depends on the workload, and the ranking genuinely inverts between them.
            - paragraph [ref=e622]:
              - strong [ref=e623]: Image generation.
              - text: "B200 is both the fastest and the cheapest option on several models – 0.57 seconds per image on FLUX.1-schnell at $0.00107, and 1.51 seconds on Z-Image-Turbo. That combination is unusual and worth checking for your model. Where you are optimizing purely for cost, an RTX A5000 produces a FLUX.2 Klein 9B image for $0.00049 and an L40S an SDXL image for $0.00067. Note that the RTX 4090 is not a strong diffusion card in these runs: on Qwen-Image 2512 (ComfyUI fp8) it takes 44.7 seconds per image, and it is the most expensive card per image on that model."
            - paragraph [ref=e624]:
              - strong [ref=e625]: Video generation.
              - text: B200 leads on the heavy models – 119 seconds for Wan 2.2 T2V A14B and 37.6 seconds for Wan 2.2 TI2V-5B. For cost rather than speed, an RTX Pro 6000 produces Wan 2.2 T2V A14B at $0.215 per video against the B200's $0.237, and on the distilled LTX-2.3 22B an RTX 4090 costs $0.00335 per video. Distilled and quantized video models change the hardware answer completely – check which variant you are running.
            - paragraph [ref=e626]:
              - strong [ref=e627]: Speech to text.
              - text: This is the one workload where a mid-range card wins outright. An L40S transcribes at 58.3 times real time on Whisper large-v3-turbo (int8_float16), ahead of the H100 SXM's 55.5 times on the same model family. For cost, an RTX A5000 runs an audio hour for $0.0071.
            - paragraph [ref=e628]:
              - strong [ref=e629]: Vision-language.
              - text: Qwen3-VL-8B-Instruct and Qwen2.5-VL-7B-Instruct both run on consumer cards – an RTX A5000 serves Qwen3-VL-8B at $0.65 per million output tokens. Switch the workload selector to Vision Q&A to compare them properly.
